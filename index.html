<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tung Pong</title>
    <style>
        :root {
            color-scheme: dark;
            --ink: #fff5d7;
            --muted: #c4b98f;
            --court: #173b38;
            --court-light: #2d6757;
            --accent: #f4c95d;
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #102523;
            color: var(--ink);
            font-family: Georgia, 'Times New Roman', serif;
        }

        body { display: grid; place-items: center; }

        #game {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background:
                linear-gradient(90deg, transparent 49.8%, rgba(255, 245, 215, .22) 50%, transparent 50.2%),
                radial-gradient(ellipse at center, var(--court-light), var(--court) 68%, #102523);
            cursor: none;
        }

        #game::before {
            content: '';
            position: absolute;
            inset: 15% 8% 9%;
            border: 1px solid rgba(244, 201, 93, .35);
            border-radius: 50%;
            box-shadow: 0 0 0 18vw rgba(16, 37, 35, .16);
            pointer-events: none;
        }

        .hud {
            position: absolute;
            z-index: 4;
            top: 26px;
            left: 7%;
            right: 7%;
            display: flex;
            justify-content: space-between;
            align-items: end;
            pointer-events: none;
        }

        h1 {
            margin: 0;
            color: var(--accent);
            font-size: clamp(1.8rem, 4vw, 3.2rem);
            letter-spacing: .04em;
            text-transform: uppercase;
        }

        .hint, .label {
            color: var(--muted);
            font: .74rem 'Trebuchet MS', sans-serif;
            letter-spacing: .12em;
            text-transform: uppercase;
        }

        .hint { margin: 6px 0 0; }

        .scoreboard {
            display: flex;
            gap: clamp(25px, 6vw, 80px);
            text-align: center;
        }

        .scoreboard strong {
            display: block;
            color: var(--accent);
            font-size: clamp(2rem, 5vw, 3.5rem);
            line-height: 1;
        }

        .court-line {
            position: absolute;
            top: 15%;
            bottom: 9%;
            left: 50%;
            border-left: 2px dashed rgba(255, 245, 215, .4);
            transform: translateX(-50%);
        }

        .player, #ball, #trail, #slash, #easteregg {
            position: absolute;
            user-select: none;
            pointer-events: none;
        }

        .player {
            z-index: 2;
            width: clamp(86px, 11vw, 145px);
            height: auto;
            transform: translateY(-50%);
            filter: drop-shadow(0 7px 4px rgba(0, 0, 0, .32));
        }

        #player-one { left: 7%; }
        #player-two { right: 7%; }

        #ball {
            z-index: 3;
            width: clamp(34px, 5vw, 62px);
            height: auto;
            transform-origin: center;
        }

        #trail {
            z-index: 2;
            width: clamp(24px, 4vw, 48px);
            height: clamp(5px, 1vw, 10px);
            border-radius: 50%;
            background: linear-gradient(90deg, transparent, rgba(244, 201, 93, .8));
            filter: blur(2px);
            transform-origin: center;
        }

        #slash {
            z-index: 5;
            display: none;
            width: clamp(110px, 15vw, 190px);
            transform: translate(-50%, -50%) rotate(var(--slash-angle, 80deg)) scaleX(-1);
        }

        #slash.visible { display: block; animation: slash-hit .22s ease-out; }

        @keyframes slash-hit {
            from { opacity: .2; transform: translate(-50%, -50%) scale(.65) rotate(calc(var(--slash-angle, 80deg) - 18deg)) scaleX(-1); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(var(--slash-angle, 80deg)) scaleX(-1); }
        }

        #easteregg {
            z-index: 9;
            display: none;
            top: 50%;
            left: 50%;
            width: min(78vw, 520px);
            max-height: 70vh;
            object-fit: contain;
            transform: translate(-50%, -50%);
            filter: drop-shadow(0 0 24px rgba(244, 201, 93, .7));
        }

        #easteregg.visible {
            display: block;
            animation: easteregg-in .25s ease-out;
        }

        @keyframes easteregg-in {
            from { opacity: 0; transform: translate(-50%, -50%) scale(.75); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }

        #message {
            position: absolute;
            z-index: 8;
            top: 50%;
            left: 50%;
            width: min(90vw, 420px);
            padding: 28px;
            border: 1px solid rgba(244, 201, 93, .6);
            background: rgba(16, 37, 35, .96);
            text-align: center;
            transform: translate(-50%, -50%);
        }

        #message h2 { margin: 0 0 8px; color: var(--accent); font-size: 2rem; }
        #message p { margin: 0 0 20px; color: var(--muted); font-family: 'Trebuchet MS', sans-serif; }
        #restart {
            padding: 11px 18px;
            border: 0;
            background: var(--accent);
            color: #173b38;
            font: bold .75rem 'Trebuchet MS', sans-serif;
            letter-spacing: .1em;
            text-transform: uppercase;
            cursor: pointer;
        }
        .hidden { display: none; }

        @media (max-width: 600px) {
            .hud { top: 18px; left: 5%; right: 5%; align-items: start; flex-direction: column; gap: 12px; }
            .scoreboard { width: 100%; justify-content: space-between; }
            .hint { font-size: .65rem; }
            #player-one { left: 2%; }
            #player-two { right: 2%; }
        }
    </style>
</head>
<body>
    <main id="game" aria-label="Jogo de ping pong Tung Pong">
        <header class="hud">
            <div>
                <h1>Tung Pong</h1>
                <p class="hint">P1: W / S &nbsp; | &nbsp; P2: ↑ / ↓</p>
            </div>
            <div class="scoreboard" aria-live="polite">
                <div><span class="label">Tung 1</span><strong id="score-one">0</strong></div>
                <div><span class="label">Tung 2</span><strong id="score-two">0</strong></div>
            </div>
        </header>

        <div class="court-line" aria-hidden="true"></div>
        <img id="player-one" class="player" src="imagens/tung_1.png" alt="Tung 1, jogador 1">
        <img id="player-two" class="player" src="imagens/tung_2.png" alt="Tung 2, jogador 2">
        <div id="trail" aria-hidden="true"></div>
        <img id="ball" src="imagens/bola.png" alt="Bola">
        <img id="slash" src="imagens/slash.gif" alt="">
        <img id="easteregg" src="imagens/easteregg.png" alt="">

        <section id="message" class="hidden" aria-live="assertive">
            <h2 id="winner">Fim de jogo</h2>
            <p id="final-score"></p>
            <button id="restart" type="button">Jogar novamente</button>
        </section>
    </main>

    <script>
        const game = document.querySelector('#game');
        const ball = document.querySelector('#ball');
        const playerOne = document.querySelector('#player-one');
        const playerTwo = document.querySelector('#player-two');
        const trail = document.querySelector('#trail');
        const slash = document.querySelector('#slash');
        const easteregg = document.querySelector('#easteregg');
        const scoreOneDisplay = document.querySelector('#score-one');
        const scoreTwoDisplay = document.querySelector('#score-two');
        const message = document.querySelector('#message');
        const winnerDisplay = document.querySelector('#winner');
        const finalScore = document.querySelector('#final-score');
        const keys = new Set();
        let ballX, ballY, velocityX, velocityY, rotation, gameSpeed, scoreOne, scoreTwo, running;
        let playerOneY, playerTwoY, lastHit = 0, restartTimer = 0;

        function resetGame() {
            ballX = game.clientWidth / 2;
            ballY = game.clientHeight / 2;
            velocityX = Math.random() > .5 ? 5 : -5;
            velocityY = (Math.random() * 4) - 2;
            gameSpeed = 5;
            rotation = 0;
            scoreOne = 0;
            scoreTwo = 0;
            playerOneY = playerTwoY = game.clientHeight / 2;
            running = true;
            message.classList.add('hidden');
            scoreOneDisplay.textContent = scoreOne;
            scoreTwoDisplay.textContent = scoreTwo;
        }

        function showSlash(x, y, angle) {
            slash.style.left = `${x}px`;
            slash.style.top = `${y}px`;
            slash.style.setProperty('--slash-angle', `${angle}deg`);
            slash.classList.remove('visible');
            void slash.offsetWidth;
            slash.classList.add('visible');
            clearTimeout(lastHit);
            lastHit = setTimeout(() => slash.classList.remove('visible'), 260);
        }

        function update() {
            if (!running) { requestAnimationFrame(update); return; }
            const playerHeight = playerOne.offsetHeight;
            const ballSize = ball.offsetWidth;
            const topLine = game.clientHeight * .15;
            const bottomLine = game.clientHeight * .91;
            const topLimit = topLine + ballSize / 2;
            const bottomLimit = bottomLine - ballSize / 2;
            const playerTopLimit = topLine + playerHeight / 2;
            const playerBottomLimit = bottomLine - playerHeight / 2;
            const paddleWidth = playerOne.offsetWidth;
            const paddleGap = game.clientWidth * .07;

            if (keys.has('w')) playerOneY -= 9.6;
            if (keys.has('s')) playerOneY += 9.6;
            if (keys.has('ArrowUp')) playerTwoY -= 9.6;
            if (keys.has('ArrowDown')) playerTwoY += 9.6;
            playerOneY = Math.max(playerTopLimit, Math.min(playerOneY, playerBottomLimit));
            playerTwoY = Math.max(playerTopLimit, Math.min(playerTwoY, playerBottomLimit));

            const previousBallX = ballX;
            const previousBallY = ballY;
            ballX += velocityX;
            ballY += velocityY;
            gameSpeed = Math.min(24, gameSpeed + .018);
            velocityX = Math.sign(velocityX) * gameSpeed;
            velocityY = Math.sign(velocityY) * Math.min(16, Math.abs(velocityY) + .01);
            rotation += velocityX * 2.5;
            const touchedTopLine = previousBallY >= topLimit && ballY < topLimit;
            const touchedBottomLine = previousBallY <= bottomLimit && ballY > bottomLimit;
            if (touchedTopLine || touchedBottomLine) {
                velocityY *= -1;
                ballY = Math.max(topLimit, Math.min(ballY, bottomLimit));
            }

            const hitsPaddle = (paddleY, isLeft) => {
                const paddleEdge = isLeft ? paddleGap + paddleWidth : game.clientWidth - paddleGap - paddleWidth;
                const ballRadius = ballSize / 2;
                const movingToward = isLeft ? velocityX < 0 : velocityX > 0;
                const crossedPaddle = isLeft
                    ? previousBallX - ballRadius > paddleEdge && ballX - ballRadius <= paddleEdge
                    : previousBallX + ballRadius < paddleEdge && ballX + ballRadius >= paddleEdge;
                return movingToward && crossedPaddle &&
                    Math.abs(ballY - paddleY) < playerHeight / 2 + ballSize / 2;
            };

            if (hitsPaddle(playerOneY, true)) {
                ballX = paddleGap + paddleWidth + ballSize / 2;
                velocityX = gameSpeed;
                velocityY += (ballY - playerOneY) * .035;
                showSlash(paddleGap + paddleWidth, playerOneY, 180);
            } else if (hitsPaddle(playerTwoY, false)) {
                ballX = game.clientWidth - paddleGap - paddleWidth - ballSize / 2;
                velocityX = -gameSpeed;
                velocityY += (ballY - playerTwoY) * .035;
                showSlash(game.clientWidth - paddleGap - paddleWidth, playerTwoY, 80);
            }

            if (ballX < -ballSize) { scoreTwo++; scoreTwoDisplay.textContent = scoreTwo; resetRound(1); }
            if (ballX > game.clientWidth + ballSize) { scoreOne++; scoreOneDisplay.textContent = scoreOne; resetRound(-1); }

            playerOne.style.top = `${playerOneY}px`;
            playerTwo.style.top = `${playerTwoY}px`;
            const ballTransform = `translate(${ballX - ballSize / 2}px, ${ballY - ballSize / 2}px) rotate(${rotation}deg)`;
            ball.style.transform = ballTransform;
            const trailDirection = velocityX > 0 ? 0 : 180;
            trail.style.transform = `translate(${ballX - trail.offsetWidth / 2}px, ${ballY - trail.offsetHeight / 2}px) rotate(${trailDirection}deg)`;
            requestAnimationFrame(update);
        }

        function resetRound(direction) {
            if ((scoreOne === 6 && scoreTwo === 7) || (scoreOne === 7 && scoreTwo === 6)) {
                running = false;
                easteregg.classList.add('visible');
                clearTimeout(restartTimer);
                restartTimer = setTimeout(() => {
                    easteregg.classList.remove('visible');
                    resetGame();
                }, 2500);
                return;
            }
            if (scoreOne >= 7 || scoreTwo >= 7) {
                running = false;
                winnerDisplay.textContent = scoreOne > scoreTwo ? 'Tung 1 venceu!' : 'Tung 2 venceu!';
                finalScore.textContent = `${scoreOne} a ${scoreTwo}`;
                message.classList.remove('hidden');
                return;
            }
            ballX = game.clientWidth / 2;
            ballY = game.clientHeight / 2;
            gameSpeed = 5;
            velocityX = direction * 5;
            velocityY = (Math.random() * 4) - 2;
        }

        window.addEventListener('keydown', (event) => {
            if (['w', 's', 'ArrowUp', 'ArrowDown'].includes(event.key)) {
                event.preventDefault();
                keys.add(event.key);
            }
        });
        window.addEventListener('keyup', (event) => keys.delete(event.key));
        document.querySelector('#restart').addEventListener('click', resetGame);
        window.addEventListener('resize', () => {
            const bottomLimit = game.clientHeight * .91 - ball.offsetWidth / 2;
            playerOneY = Math.min(playerOneY, bottomLimit);
            playerTwoY = Math.min(playerTwoY, bottomLimit);
        });
        resetGame();
        update();
    </script>
</body>
</html>
